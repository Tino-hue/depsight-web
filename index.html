<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>depsight — MoonBit 依赖健康检测平台</title>
    <link rel="stylesheet" href="./css/depsight.css" />
    <!-- Three.js via ESM CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- 顶部导航 -->
      <header class="topbar">
        <div class="logo">
          <span class="logo-icon">◉</span>
          <span class="logo-text">depsight</span>
          <span class="logo-tag">MoonBit 依赖体检</span>
        </div>
        <nav class="nav">
          <button class="nav-btn active" data-view="analyze">分析</button>
          <button class="nav-btn" data-view="graph">3D 依赖图</button>
          <button class="nav-btn" data-view="trends">趋势</button>
          <button class="nav-btn" data-view="ecosystem">生态大盘</button>
        </nav>
        <div class="topbar-right">
          <span id="wasm-status" class="wasm-status">WASM 加载中…</span>
        </div>
      </header>

      <!-- 主内容 -->
      <main class="main">
        <!-- 分析视图：输入 + 报告 -->
        <section id="view-analyze" class="view active">
          <div class="analyze-layout">
            <!-- 输入面板 -->
            <div class="input-panel">
              <h2>检测你的依赖</h2>
              <div class="input-tabs">
                <button class="input-tab active" data-input="text">
                  粘贴 moon.mod
                </button>
                <button class="input-tab" data-input="package">输入包名</button>
                <button class="input-tab" data-input="demo">示例数据</button>
              </div>
              <div class="input-body">
                <div id="input-text" class="input-pane active">
                  <textarea
                    id="moon-mod-input"
                    rows="10"
                    placeholder='粘贴 moon.mod 内容，例如：&#10;&#10;name = "my/app"&#10;version = "1.0.0"&#10;&#10;import { "moonbitlang/core" }'
                  ></textarea>
                  <div class="file-upload-row">
                    <label for="moon-mod-file" class="btn btn-secondary">
                      上传 moon.mod 文件
                    </label>
                    <input
                      type="file"
                      id="moon-mod-file"
                      accept=".mod,.txt,.toml,text/plain"
                    />
                    <span id="file-upload-name" class="file-upload-name"></span>
                  </div>
                </div>
                <div id="input-package" class="input-pane">
                  <p class="package-hint">
                    mooncakes.io 暂不提供公开搜索 API，请输入完整包名拉取分析
                  </p>
                  <input
                    type="text"
                    id="package-name"
                    placeholder="moonbitlang/core"
                  />
                  <input
                    type="text"
                    id="package-version"
                    placeholder="版本号（可选）"
                  />
                  <button id="load-package-btn" class="btn btn-secondary">
                    从 mooncakes.io 拉取
                  </button>
                  <div id="package-load-status" class="load-status"></div>
                </div>
                <div id="input-demo" class="input-pane">
                  <p>使用内置示例数据快速体验</p>
                  <button id="load-demo-btn" class="btn btn-secondary">
                    加载示例
                  </button>
                </div>
              </div>
              <div class="input-actions">
                <button id="analyze-btn" class="btn btn-primary">
                  开始分析
                </button>
                <button id="analyze-offline-btn" class="btn">离线模式</button>
              </div>
              <div id="analyze-status" class="analyze-status"></div>
            </div>

            <!-- 结果面板 -->
            <div id="result-panel" class="result-panel hidden">
              <!-- 健康分仪表盘 -->
              <div class="dashboard" id="dashboard">
                <div class="score-ring-wrap">
                  <svg
                    class="score-ring"
                    width="140"
                    height="140"
                    viewBox="0 0 140 140"
                  >
                    <circle
                      class="score-ring-bg"
                      cx="70"
                      cy="70"
                      r="60"
                      fill="none"
                      stroke-width="12"
                    />
                    <circle
                      class="score-ring-fg"
                      id="score-ring-fg"
                      cx="70"
                      cy="70"
                      r="60"
                      fill="none"
                      stroke-width="12"
                    />
                  </svg>
                  <div class="score-ring-text">
                    <div class="score-ring-value" id="overall-score">--</div>
                    <div class="score-ring-label">健康分</div>
                  </div>
                </div>
                <div class="score-dimensions" id="score-dimensions"></div>
                <div class="summary-cards" id="summary-cards"></div>
              </div>

              <!-- 风险列表 -->
              <div class="risk-list-wrap">
                <h3>风险列表</h3>
                <div id="risk-list" class="risk-list"></div>
              </div>

              <!-- 大小明细 -->
              <div class="size-list-wrap">
                <h3>体积 TOP 5</h3>
                <div id="size-list" class="size-list"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 3D 依赖图视图 -->
        <section id="view-graph" class="view">
          <div class="graph-layout">
            <div class="graph-toolbar">
              <input type="text" id="graph-search" placeholder="搜索包…" />
              <button class="btn btn-sm" id="graph-highlight-path">
                高亮路径
              </button>
              <button class="btn btn-sm" id="graph-reset-view">重置视角</button>
              <span id="graph-selected-info" class="graph-selected-info"></span>
            </div>
            <div id="graph3d-container" class="graph3d-container"></div>
            <div id="graph-node-detail" class="graph-node-detail hidden"></div>
          </div>
        </section>

        <!-- 趋势视图 -->
        <section id="view-trends" class="view">
          <div class="trends-layout">
            <div class="trends-header">
              <h2>健康分历史趋势</h2>
              <select id="trend-package-selector">
                <option value="">选择包…</option>
              </select>
            </div>
            <canvas id="trend-chart" width="900" height="360"></canvas>
            <div id="trend-stats" class="trend-stats"></div>
          </div>
        </section>

        <!-- 生态大盘视图 -->
        <section id="view-ecosystem" class="view">
          <div class="ecosystem-layout">
            <h2>MoonBit 生态健康大盘</h2>
            <div id="ecosystem-cards" class="ecosystem-cards"></div>
            <div class="ecosystem-charts">
              <div class="ecosystem-chart">
                <h3>生态健康分分布</h3>
                <canvas
                  id="eco-score-histogram"
                  width="420"
                  height="260"
                ></canvas>
              </div>
              <div class="ecosystem-chart">
                <h3>最常见风险类型</h3>
                <canvas id="eco-risk-bar" width="420" height="260"></canvas>
              </div>
            </div>
            <div id="eco-top-packages" class="eco-top-packages"></div>
          </div>
        </section>
      </main>

      <!-- AI 分析抽屉（跨视图） -->
      <div id="ai-drawer" class="ai-drawer">
        <div class="ai-drawer-header">
          <h3>AI 智能诊断</h3>
          <button id="ai-close" class="ai-close">×</button>
        </div>
        <div id="ai-content" class="ai-content">
          <p class="ai-hint">运行分析后，点击任意风险项的「AI 诊断」按钮</p>
        </div>
      </div>
      <button id="ai-toggle" class="ai-toggle hidden">✨ AI</button>
    </div>

    <!-- 模块入口 -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
